# Chico Protocol Installation Manifest
# Generated by the chico-protocol CLI installer.

system_name: Chico Protocol
version: "{{CHICO_VERSION}}"
install_date: "{{INSTALL_DATE}}"
last_updated: "{{INSTALL_DATE}}"

# User Configuration
user_name: "{{USER_NAME}}"
communication_language: "{{COMMUNICATION_LANGUAGE}}"
document_output_language: "{{DOCUMENT_LANGUAGE}}"

# IDE Integration
ide: claude-code

# Modules
modules:
  - name: core
    version: 1.0.0
    source: built-in
    description: Utility skills — brainstorming, editorial review, party mode, adversarial review, help

  - name: cmm
    version: 1.0.0
    source: built-in
    description: Product Method Core — product development pipeline (analysis, planning, solutioning, implementation)

  - name: cis
    version: 1.0.0
    source: built-in
    description: Creative Intelligence Suite — innovation, creativity, storytelling, design thinking

  - name: tea
    version: 1.0.0
    source: built-in
    description: Test Architecture Enterprise — QA methodology, verification, audits

  - name: gds
    version: 1.0.0
    source: built-in
    description: Game Dev Studio — game development specialist workflows

  - name: cmb
    version: 1.0.0
    source: built-in
    description: Chico Builder — agent, module, workflow creation framework

  - name: web
    version: 1.0.0
    source: built-in
    description: Web Pipeline — specialized web dev agents (brand, copy, data, auth, UI, devops, post-launch)

  - name: verify
    version: 1.0.0
    source: built-in
    description: Verification — 5 individual passes (concept, production, functional, browser, completude) invoked on demand

# Paths
paths:
  skills: "{project-root}/.claude/skills"
  config: "{project-root}/_chico/_config"
  output: "{project-root}/_chico-output"
  planning_artifacts: "{project-root}/_chico-output/planning-artifacts"
  implementation_artifacts: "{project-root}/_chico-output/implementation-artifacts"
  reports: "{project-root}/_chico-output/reports"
  testing_artifacts: "{project-root}/_chico-output/testing-artifacts"
  project_knowledge: "{project-root}/docs"
  memory: "{project-root}/_chico/memory"
  templates: "{project-root}/_chico/templates"

# Statistics
stats:
  total_modules: 8
  total_agents: 42
  total_skills: 130
