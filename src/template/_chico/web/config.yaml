# Web Pipeline Module Configuration
# Specialized web development agents
# Origin: CCCTA V3

module_name: web
module_version: 1.0.0
module_description: Specialized web dev agents — brand, copy, data, auth, UI, devops, post-launch

# Inherited from manifest
user_name: "{{USER_NAME}}"
communication_language: "{{COMMUNICATION_LANGUAGE}}"
document_output_language: "{{DOCUMENT_LANGUAGE}}"
output_folder: "{project-root}/_chico-output"
planning_artifacts: "{project-root}/_chico-output/planning-artifacts"
implementation_artifacts: "{project-root}/_chico-output/implementation-artifacts"
project_knowledge: "{project-root}/docs"

# Default tech stack (overridable per project)
default_stack:
  framework: Next.js 15+
  ui_library: React 19
  language: TypeScript (strict)
  styling: Tailwind CSS 4
  orm: Prisma
  database: PostgreSQL
  testing: Playwright + Vitest
  containerization: Docker
  ci_cd: GitHub Actions

# Agent groups by pipeline phase
agent_groups:
  planning: [chico-web-brand, chico-web-copy, chico-web-growth]
  development: [chico-web-data-layer, chico-web-auth, chico-web-ui-components, chico-web-forms, chico-web-user-flows, chico-web-admin, chico-web-integration, chico-web-realtime, chico-web-seo-perf]
  deployment: [chico-web-docker, chico-web-cicd, chico-web-cloud]
  post-launch: [chico-web-analytics, chico-web-monitoring, chico-web-growth]
  continuous: [chico-web-bug-hunter, chico-web-feature-planner, chico-web-refactor]

# Knowledge bases (from CCCTA V3)
knowledge_bases:
  - react-nextjs.md
  - database.md
  - api-design.md
  - ui-design-system.md
  - security.md
  - devops.md
